<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">GetANNY, a modern download workspace</title>
<desc id="desc">GetANNY leads this product graphic with features for files, media, torrents, browser handoff and workspace customization. A smaller panel lists selected Internet Download Manager features. The footer gives Acev Dev Co's hands-on preference.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d13"/><stop offset=".58" stop-color="#0d1722"/><stop offset="1" stop-color="#111c28"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2a"/><stop offset="1" stop-color="#0b131c"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#10a8ff"/><stop offset="1" stop-color="#50d6ff"/></linearGradient>
  <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102d42"/><stop offset=".55" stop-color="#102333"/><stop offset="1" stop-color="#131d28"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#138dff" stop-opacity=".20"/><stop offset="1" stop-color="#138dff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="1180" rx="28" fill="url(#bg)"/>
<ellipse cx="360" cy="75" rx="540" ry="300" fill="url(#glow)"/>
<path d="M32 32H1568V1148H32Z" fill="none" stroke="#5a7183" stroke-opacity=".30" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="68" y="50" width="404" height="42" rx="21" fill="#101d29" stroke="#304657"/>
  <circle cx="92" cy="71" r="5" fill="#40c7ff"/>
  <text x="110" y="78" fill="#b6cad7" font-size="17" font-weight="700" letter-spacing="2">ACEV DEV CO  ·  WINDOWS DOWNLOAD MANAGER</text>
  <text x="66" y="174" fill="#f5f8fb" font-size="82" font-weight="800" letter-spacing="-3">GetANNY</text>
  <path d="M435 116V176" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="466" y="139" fill="#54caff" font-size="27" font-weight="750" letter-spacing="1.5">THE MODERN DOWNLOAD WORKSPACE</text>
  <text x="466" y="176" fill="#b6c7d3" font-size="22">Files, media, torrents and browser downloads in one place.</text>

  <rect x="55" y="222" width="1048" height="642" rx="25" fill="url(#hero)" stroke="#24445b" stroke-width="2"/>
  <rect x="55" y="222" width="7" height="642" rx="3.5" fill="url(#accent)"/>
  <rect x="89" y="252" width="290" height="34" rx="17" fill="#102f44" stroke="#1e6388"/>
  <text x="234" y="275" fill="#64d4ff" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">BUILT AROUND YOUR WORKFLOW</text>
  <text x="89" y="324" fill="#f1f6fa" font-size="31" font-weight="760">Files. Media. Torrents. All in GetANNY.</text>

  <g>
    <rect x="88" y="350" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
    <rect x="108" y="371" width="48" height="48" rx="14" fill="#123f59"/>
    <path d="M132 380v22m-9-9 9 9 9-9M120 410h24" fill="none" stroke="#69d6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="173" y="386" fill="#f2f7fa" font-size="22" font-weight="750">Multi-connection transfers</text>
    <text x="173" y="418" fill="#b8c8d3" font-size="18">Pause, resume and retry HTTP/HTTPS downloads.</text>
    <rect x="108" y="449" width="94" height="25" rx="12.5" fill="#123547"/><text x="155" y="467" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">FILE CONTROL</text>
  </g>
  <g>
    <rect x="584" y="350" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
    <rect x="604" y="371" width="48" height="48" rx="14" fill="#123f59"/>
    <rect x="616" y="382" width="23" height="26" rx="3" fill="none" stroke="#69d6ff" stroke-width="2.5"/>
    <path d="M621 388h13M621 394h13M621 400h9" stroke="#69d6ff" stroke-width="2"/>
    <text x="669" y="386" fill="#f2f7fa" font-size="22" font-weight="750">Media Studio</text>
    <text x="669" y="418" fill="#b8c8d3" font-size="18">Explore formats, thumbnails, subtitles and segments.</text>
    <rect x="604" y="449" width="115" height="25" rx="12.5" fill="#123547"/><text x="661" y="467" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">VIDEO + AUDIO</text>
  </g>
  <g>
    <rect x="88" y="512" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
