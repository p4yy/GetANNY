    <path d="M128 546l-8 10 8 10m8-20 8 10-8 10m-4-23-4 26" fill="none" stroke="#69d6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="173" y="548" fill="#f2f7fa" font-size="22" font-weight="750">Torrent support</text>
    <text x="173" y="580" fill="#b8c8d3" font-size="18">Add magnet links and .torrent files.</text>
    <rect x="108" y="611" width="93" height="25" rx="12.5" fill="#123547"/><text x="154" y="629" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">MAGNET + TORRENT</text>
  </g>
  <g>
    <rect x="584" y="512" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
    <rect x="604" y="533" width="48" height="48" rx="14" fill="#123f59"/>
    <path d="M628 543a12 12 0 1 0 0 24m0-24v8m0 8v8m-12-12h24" fill="none" stroke="#69d6ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="669" y="548" fill="#f2f7fa" font-size="22" font-weight="750">Browser Assistant</text>
    <text x="669" y="580" fill="#b8c8d3" font-size="18">Authenticated local handoff from supported browsers.</text>
    <rect x="604" y="611" width="156" height="25" rx="12.5" fill="#123547"/><text x="682" y="629" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">DIRECT LOCAL BRIDGE</text>
  </g>
  <g>
    <rect x="88" y="674" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
