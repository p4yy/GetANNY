  <text x="68" y="922" fill="#f1b45d" font-size="17" font-weight="700" letter-spacing="2">ACEV APPS CO’S PICK</text>
  <text x="68" y="972" fill="#f5f7f8" font-size="30" font-weight="700">GetANNY — faster in our testing. Cleaner to use.</text>
