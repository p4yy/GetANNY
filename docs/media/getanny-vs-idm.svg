    <circle cx="132" cy="719" r="12" fill="none" stroke="#69d6ff" stroke-width="2.5"/><path d="M120 719h24M132 707c5 6 5 18 0 24M132 707c-5 6-5 18 0 24" fill="none" stroke="#69d6ff" stroke-width="2"/>
    <text x="173" y="710" fill="#f2f7fa" font-size="22" font-weight="750">Your workspace, your style</text>
    <text x="173" y="742" fill="#b8c8d3" font-size="18">12 themes and seven interface languages.</text>
    <rect x="108" y="773" width="138" height="25" rx="12.5" fill="#123547"/><text x="177" y="791" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">PERSONALIZATION</text>
  </g>
  <g>
    <rect x="584" y="674" width="476" height="143" rx="18" fill="#111f2b" stroke="#294052"/>
    <rect x="604" y="695" width="48" height="48" rx="14" fill="#123f59"/>
    <path d="M616 708h24M616 719h24M616 730h24" stroke="#69d6ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="623" cy="708" r="3" fill="#69d6ff"/><circle cx="633" cy="719" r="3" fill="#69d6ff"/><circle cx="620" cy="730" r="3" fill="#69d6ff"/>
    <text x="669" y="710" fill="#f2f7fa" font-size="22" font-weight="750">Precise transfer controls</text>
    <text x="669" y="742" fill="#b8c8d3" font-size="18">Scheduling, speed limits and retry settings.</text>
    <rect x="604" y="773" width="117" height="25" rx="12.5" fill="#123547"/><text x="662" y="791" fill="#75d5fa" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">CONFIGURABLE</text>
  </g>

  <rect x="1124" y="222" width="421" height="642" rx="25" fill="#0c131b" stroke="#33404d" stroke-width="2"/>
  <text x="1158" y="275" fill="#8596a4" font-size="15" font-weight="800" letter-spacing="2">THE CLASSIC TOOLKIT</text>
  <text x="1158" y="325" fill="#d5dce1" font-size="33" font-weight="760">Internet Download</text>
  <text x="1158" y="365" fill="#d5dce1" font-size="33" font-weight="760">Manager</text>
  <text x="1158" y="399" fill="#91a0ac" font-size="18">A familiar name in file transfers.</text>
  <path d="M1158 425H1512" stroke="#46525d" stroke-opacity=".55"/>
  <text x="1158" y="465" fill="#a8b5bf" font-size="16" font-weight="800" letter-spacing="1.5">SELECTED FEATURES</text>
  <g fill="#c0cbd2" font-size="18">
    <circle cx="1168" cy="509" r="4" fill="#778995"/><text x="1187" y="515">Dynamic file segmentation</text>
    <circle cx="1168" cy="566" r="4" fill="#778995"/><text x="1187" y="572">Resume and error recovery</text>
    <circle cx="1168" cy="623" r="4" fill="#778995"/><text x="1187" y="629">Browser integration</text>
    <circle cx="1168" cy="680" r="4" fill="#778995"/><text x="1187" y="686">Video download panel</text>
    <circle cx="1168" cy="737" r="4" fill="#778995"/><text x="1187" y="743">Queues and scheduling</text>
  </g>
  <path d="M1158 778H1512" stroke="#46525d" stroke-opacity=".55"/>
  <text x="1158" y="812" fill="#8796a1" font-size="15">Selected highlights, not a full feature list.</text>

  <rect x="55" y="892" width="1490" height="226" rx="25" fill="url(#footer)" stroke="#1e5474" stroke-width="2"/>
  <rect x="88" y="925" width="226" height="36" rx="18" fill="#0b4c70" stroke="#2a9bcd"/>
  <path d="M110 943l7 7 13-15" fill="none" stroke="#86e3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="950" fill="#adf0ff" font-size="16" font-weight="800" letter-spacing="1.4">ACEV DEV CO’S PICK</text>
  <text x="88" y="1007" fill="#f5f8fb" font-size="34" font-weight="760">Faster in our hands-on testing. Cleaner for everyday downloads.</text>
  <text x="88" y="1051" fill="#b8d0df" font-size="20">Our pick for modern file, media and torrent workflows in one configurable workspace.</text>
  <text x="88" y="1090" fill="#829aa9" font-size="15">Acev Dev Co’s first-hand assessment. Speed depends on the file source, server and connection.</text>
  <g>
    <rect x="1180" y="940" width="115" height="38" rx="19" fill="#102e41" stroke="#286889"/><text x="1237" y="965" fill="#83dfff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">FILES</text>
    <rect x="1310" y="940" width="130" height="38" rx="19" fill="#102e41" stroke="#286889"/><text x="1375" y="965" fill="#83dfff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">MEDIA</text>
    <rect x="1180" y="990" width="115" height="38" rx="19" fill="#102e41" stroke="#286889"/><text x="1237" y="1015" fill="#83dfff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">TORRENTS</text>
    <rect x="1310" y="990" width="130" height="38" rx="19" fill="#102e41" stroke="#286889"/><text x="1375" y="1015" fill="#83dfff" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">BROWSER</text>
  </g>
</g>
</svg>