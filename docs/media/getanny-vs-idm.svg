<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1020" role="img" aria-labelledby="title desc">
<title id="title">GetANNY and IDM feature comparison</title>
<desc id="desc">Hand-drawn chalkboard comparison of selected GetANNY and Internet Download Manager features.</desc>
<defs>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b141b"/><stop offset="1" stop-color="#101b23"/></linearGradient>
  <pattern id="chalkdust" width="71" height="59" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="11" r="1" fill="#e5edf0" opacity=".11"/><circle cx="45" cy="38" r="1.2" fill="#e5edf0" opacity=".10"/><circle cx="63" cy="7" r=".8" fill="#e5edf0" opacity=".08"/>
  </pattern>
</defs>
<rect width="1320" height="1020" rx="14" fill="url(#board)"/>
<rect width="1320" height="1020" rx="14" fill="url(#chalkdust)"/>
