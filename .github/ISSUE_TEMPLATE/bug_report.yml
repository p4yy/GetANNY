name: Bug report
description: Report a reproducible problem in GetANNY Download Manager
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before filing, remove personal paths, download URLs, and credentials from logs or screenshots.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "2.6.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and relevant browser
      description: Include Windows and browser versions only when relevant.
    validations:
      required: false
